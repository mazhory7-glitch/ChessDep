services:
  chessdep:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: sqlite:////data/chessdep.db
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - chessdep-data:/data
    restart: unless-stopped

volumes:
  chessdep-data:
